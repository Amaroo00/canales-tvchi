name: Pruebas del bot

on:
  pull_request:
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
