name: Guardián 24/7 - IPTV Chile

on:
  schedule:
    # Cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write # Necesario para actualizar canales.m3u y STATUS.md

concurrency:
  group: guardian-iptv
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sincronizar canales desde listas públicas
        # Si una lista falla, el guardián igual corre con lo que ya hay.
        continue-on-error: true
        run: python scripts/sync_public_sources.py

      - name: Renovar tokens de canales públicos (TVN)
        continue-on-error: true
        run: python scripts/refresh_tokens.py

      - name: Ejecutar Guardián de Canales
        run: python scripts/guardian.py

      - name: Guardar cambios si hubo actualización
        run: |
          git config --global user.name "Guardian-IPTV[bot]"
          git config --global user.email "guardian-bot@users.noreply.github.com"
          git add canales.m3u STATUS.md
          if git diff --staged --quiet; then
            echo "Sin cambios: todos los canales siguen igual."
          else
            git commit -m "🤖 Guardián 24/7: lista actualizada y verificada [skip ci]"
            git pull --rebase --autostash
            git push
          fi
