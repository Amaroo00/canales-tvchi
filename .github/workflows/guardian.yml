name: Guardián 24/7 - IPTV Chile

on:
  schedule:
    # Una vez por hora; minuto no redondo para reducir demoras de GitHub.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/channels.json'
      - 'config/public_sources.json'
      - 'config/logos.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/guardian.yml'

permissions:
  contents: read

concurrency:
  group: guardian-iptv-main
  cancel-in-progress: false

jobs:
  check-and-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      GUARDIAN_WORKERS: '6'
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Instalar herramientas de comprobación multimedia
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Ejecutar pruebas sin depender de señales externas
        run: python -m unittest discover -s tests -v

      - name: Descubrir fuentes y verificar HLS, vídeo y audio
        run: python scripts/guardian.py --require-media-tools

      - name: Guardar diagnóstico de la ejecución
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostico-canales-${{ github.run_id }}
          path: |
            STATUS.md
            data/health.json
          retention-days: 7

      - name: Publicar lista y respaldos
        run: |
          git config user.name 'Guardian-IPTV[bot]'
          git config user.email 'guardian-bot@users.noreply.github.com'
          git add canales.m3u canales_verificados.m3u config/backups.json data/health.json STATUS.md
          if ! git diff --staged --quiet; then
            git commit -m '🤖 Señales y audio comprobados; respaldos actualizados [skip ci]'
            # No mezclar snapshots calculados contra una configuración anterior.
            # Si main cambió durante la prueba, el push falla sin forzar ni pisar cambios.
            git push origin HEAD:main
          fi
